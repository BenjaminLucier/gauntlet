name: Release

# release-plz on every push to main (see CONTRIBUTING.md, "Releasing"):
#
# - `release-pr` opens or updates the release PR: the version bump in
#   Cargo.toml and Cargo.lock, and the CHANGELOG.md section.
# - `release` does nothing until that PR is merged. Then it publishes the
#   crate to crates.io, tags the commit and creates a draft GitHub Release.
#   The binaries build into the draft, which is published only once they are
#   all up, and the Homebrew tap is updated last.
#
# Everything runs in this one workflow: a tag or release created with
# GITHUB_TOKEN doesn't trigger other workflows.
#
# The crates.io trusted publisher names this file and the `release`
# environment, which only deploys from main.

on:
  push:
    branches: [main]

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Uses RELEASE_TOKEN (a fine-grained PAT or GitHub App token) instead of
  # GITHUB_TOKEN so that CI runs on the PR it opens.
  release-pr:
    name: Release PR
    runs-on: ubuntu-latest
    if: github.repository_owner == 'BenjaminLucier'
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  # Publishes a version that isn't on crates.io yet, with trusted publishing
  # (no stored registry token), tags it and creates the draft release.
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.repository_owner == 'BenjaminLucier'
    environment: release
    permissions:
      contents: write
      id-token: write
      pull-requests: read
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      created: ${{ steps.release-plz.outputs.releases_created }}
      tag: ${{ steps.read.outputs.tag }}
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        id: release-plz
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Read the release
        id: read
        if: steps.release-plz.outputs.releases_created == 'true'
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          tag=$(jq -r '.[0].tag' <<<"$RELEASES")
          version=$(jq -r '.[0].version' <<<"$RELEASES")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # A draft release doesn't create its tag, and the uploads need one.
      # release-plz pushes the tag itself; this only covers it if it didn't.
      - name: Make sure the tag exists
        if: steps.release-plz.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.read.outputs.tag }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --silent 2>/dev/null; then
            echo "Tag $TAG exists"
          else
            echo "::warning::release-plz did not push $TAG; creating it at $GITHUB_SHA"
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"
          fi
      - name: Attach the Windows install script
        if: steps.release-plz.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.read.outputs.tag }}
        run: gh release upload "$TAG" install.ps1 --repo "$GITHUB_REPOSITORY"

  build:
    name: Build ${{ matrix.target }}
    needs: release
    if: needs.release.outputs.created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          # Native runners for each architecture, so no cross toolchain is
          # needed; Rust bundles musl, and musl-tools covers the C code, making
          # the binaries fully static.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      # So the binary runs without the Visual C++ Redistributable. (Your code
      # is compiled by your own rustc, which needs the MSVC tools anyway.)
      - name: Link the C runtime statically on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: echo "RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"
      # syntect (through tui-markdown) builds Oniguruma, a C library, so musl
      # targets need musl's C compiler too. The runner's own architecture
      # matches the target, so the distribution's musl-gcc does.
      - name: Install the musl C compiler
        if: endsWith(matrix.target, '-linux-musl')
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        id: upload
        with:
          bin: gauntlet
          target: ${{ matrix.target }}
          # The workflow runs on a push to main, so name the release's tag.
          ref: refs/tags/${{ needs.release.outputs.tag }}
          archive: $bin-$target
          include: LICENSE-APACHE,LICENSE-MIT,README.md
          checksum: sha256
          profile: dist
          # Every target builds on a runner of its own architecture, so plain
          # cargo works. The default picks `cross` for some targets, and cross
          # assumes an x86_64 host.
          build-tool: cargo
          locked: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.upload.outputs.tar || steps.upload.outputs.zip }}

  publish-release:
    name: Publish release
    needs: [release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"

  homebrew:
    name: Update Homebrew tap
    needs: [release, publish-release]
    # Prereleases (1.2.0-rc.1) stay off Homebrew.
    if: ${{ !contains(needs.release.outputs.version, '-') }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      - name: Write the formula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          mkdir checksums
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.sha256' --dir checksums
          .github/scripts/homebrew-formula.sh "$VERSION" checksums > gauntlet.rb
          cat gauntlet.rb
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: BenjaminLucier/homebrew-tap
          path: tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          persist-credentials: true # zizmor: ignore[artipacked] the next step pushes; nothing is uploaded
      - name: Commit and push
        env:
          VERSION: ${{ needs.release.outputs.version }}
        working-directory: tap
        run: |
          mkdir -p Formula
          mv ../gauntlet.rb Formula/gauntlet.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/gauntlet.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date"
            exit 0
          fi
          git commit -m "gauntlet $VERSION"
          git push

  # Install the published release the way users do, and run it: `check` over
  # a section compiles and tests the embedded problems with the runner image's
  # Rust toolchain, the same way a player's code is.
  smoke-test:
    name: Install (${{ matrix.name }})
    needs: [release, homebrew]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Homebrew macOS
            os: macos-latest
          - name: Homebrew Linux
            os: ubuntu-latest
          - name: Windows script
            os: windows-latest
    runs-on: ${{ matrix.os }}
    permissions: {}
    steps:
      - if: runner.os != 'Windows'
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv 2>/dev/null || brew shellenv)"
          brew install BenjaminLucier/tap/gauntlet
          gauntlet --version | grep -F "$VERSION"
          gauntlet check two_pointers
      - if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.release.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          $env:GAUNTLET_VERSION = $env:VERSION
          irm "https://github.com/$env:REPO/releases/download/v$env:VERSION/install.ps1" | iex
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\gauntlet\gauntlet.exe'
          $out = & $exe --version
          if ($out -notmatch [regex]::Escape($env:VERSION)) { throw "unexpected version: $out" }
          & $exe check two_pointers
          if ($LASTEXITCODE -ne 0) { throw "gauntlet check failed with exit code $LASTEXITCODE" }
