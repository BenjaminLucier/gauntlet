# git-cliff: https://git-cliff.org/docs/configuration
# Writes CHANGELOG.md sections from Conventional Commits. See CONTRIBUTING.md
# ("Releasing") for how it is used.

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message | split(pat="\n") | first | upper_first | trim }}\
{% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = true
# Only typed commits make it in; earlier free-form history is left out.
filter_unconventional = true
filter_commits = true
protect_breaking_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
# Groups appear in the order of their numeric prefix, which is hidden.
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Added" },
    { message = "^fix", group = "<!-- 1 -->Fixed" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^refactor", group = "<!-- 3 -->Changed" },
    { message = "^docs", group = "<!-- 4 -->Documentation" },
    { message = "^chore\\(deps\\)", skip = true },
    { message = "^(ci|chore|test|build|style)", skip = true },
]
