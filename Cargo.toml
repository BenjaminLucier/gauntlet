[package]
name = "gauntlet"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/BenjaminLucier/gauntlet"

[dependencies]
ansi-to-tui = "8.0.1"
catppuccin = { version = "2.8.0", features = ["ratatui"] }
chrono = { version = "0.4.45", features = ["serde"] }
color-eyre = "0.6.5"
crossterm = "0.29"
libc = "0.2.191"
notify = "8"
quick-xml = "0.42.0"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
rs-fsrs = "1.2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
terminal-colorsaurus = "1.0.3"
throbber-widgets-tui = "0.11.1"
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tui-markdown = "0.3.13"
tui-tree-widget = "0.24.1"
