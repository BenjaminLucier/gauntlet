title = "Diameter of Binary Tree"
difficulty = "easy"

complexity = '''
- Time: `O(n)`
- Space: `O(h)`
'''

[[hints]]
text = '''
The longest path "bends" at exactly one node. If it bends at `x`, its length
is `height(x.left) + height(x.right)` (heights counted in nodes).
'''

[[hints]]
text = '''
Computing `height` separately for every node is `O(n^2)` on a skewed tree.
Instead, write one DFS that returns the height and, as a side effect, updates
the best diameter seen so far.
'''
