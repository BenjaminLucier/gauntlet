title = "Linked List Cycle"
difficulty = "easy"

complexity = '''
- Time: `O(n)`
- Space: `O(1)` — no visited set
'''

[[hints]]
text = '''
The easy way is to remember every index you've visited. That's `O(n)` memory —
what if you couldn't remember anything?
'''

[[hints]]
text = '''
Move one cursor one step at a time and another two steps at a time. If there's
a cycle, the fast one eventually laps the slow one and they land on the same
node. If there isn't, the fast one runs off the end.
'''
