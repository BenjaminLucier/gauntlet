title = "Top K Frequent Elements"
difficulty = "medium"

complexity = '''
- Time: `O(n)` expected (bucket sort) — `O(n log k)` with a heap is also fine
- Space: `O(n)`
'''

[[hints]]
text = '''
Count occurrences with a hash map first.
'''

[[hints]]
text = '''
Sorting the `(value, count)` pairs by count is `O(n log n)`. Can you beat that?
'''

[[hints]]
text = '''
A count is between `1` and `n`. Make `n + 1` buckets where `bucket[c]` holds
the values that occur exactly `c` times, then walk the buckets from high to
low until you have `k` values.
'''
